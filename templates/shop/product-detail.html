<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/customer}">

<head>
    <title th:text="${product.name}">Chi tiết sản phẩm</title>
    <style>
        .product-gallery img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .thumbnail:hover,
        .thumbnail.active {
            border-color: #667eea;
        }

        .product-price {
            font-size: 1.8rem;
            font-weight: 700;
            color: #e74c3c;
        }

        .original-price {
            font-size: 1.2rem;
            text-decoration: line-through;
            color: #999;
        }

        .product-info-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .spec-table td {
            padding: 0.75rem 0;
            border-bottom: 1px solid #eee;
        }

        .spec-table td:first-child {
            color: #666;
            width: 40%;
        }

        .btn-add-cart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            border: none;
        }

        .btn-add-cart:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .related-product {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
        }

        .related-product:hover {
            transform: translateY(-3px);
        }

        .related-product img {
            height: 150px;
            width: 100%;
            object-fit: cover;
        }

        /* Wishlist Button */
        .btn-wishlist {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #e74c3c;
            background: white;
            color: #e74c3c;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .btn-wishlist:hover,
        .btn-wishlist.active {
            background: #e74c3c;
            color: white;
        }

        .btn-wishlist.active i {
            font-weight: 900;
        }

        /* Reviews Section */
        .reviews-section {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .rating-overview {
            display: flex;
            gap: 2rem;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
            margin-bottom: 1.5rem;
        }

        .rating-big {
            text-align: center;
        }

        .rating-big .number {
            font-size: 3rem;
            font-weight: 700;
            color: #333;
        }

        .rating-big .stars {
            color: #ffc107;
            font-size: 1.2rem;
        }

        .rating-bars {
            flex: 1;
        }

        .rating-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .rating-bar .label {
            width: 60px;
            font-size: 0.85rem;
        }

        .rating-bar .bar {
            flex: 1;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .rating-bar .bar-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
        }

        .rating-bar .count {
            width: 30px;
            font-size: 0.85rem;
            color: #666;
        }

        .review-item {
            padding: 1.5rem 0;
            border-bottom: 1px solid #eee;
        }

        .review-item:last-child {
            border-bottom: none;
        }

        .review-header {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .review-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .review-meta {
            flex: 1;
        }

        .review-author {
            font-weight: 600;
        }

        .verified-badge {
            background: #28a745;
            color: white;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-left: 0.5rem;
        }

        .review-images {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
        }

        .review-images img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }

        .review-actions {
            display: flex;
            gap: 1rem;
            margin-top: 0.75rem;
        }

        .review-actions button {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
        }

        .review-actions button:hover {
            color: #667eea;
        }

        .review-form {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1.5rem;
        }

        .star-rating {
            display: flex;
            gap: 0.25rem;
            font-size: 1.5rem;
        }

        .star-rating i {
            cursor: pointer;
            color: #ddd;
            transition: color 0.2s;
        }

        .star-rating i.active,
        .star-rating i:hover {
            color: #ffc107;
        }
    </style>
</head>

<body>
    <main layout:fragment="content">
        <div class="container py-5">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/products}">Sản phẩm</a></li>
                    <li class="breadcrumb-item active" th:text="${product.name}">Chi tiết</li>
                </ol>
            </nav>

            <div class="row">
                <!-- Product Gallery -->
                <div class="col-lg-6 mb-4">
                    <div class="product-gallery">
                        <img th:src="${product.primaryImageUrl ?: '/images/no-image.png'}" id="mainImage" alt="">
                        <div class="d-flex gap-2 flex-wrap"
                            th:if="${product.images != null and !#lists.isEmpty(product.images)}">
                            <img th:each="img : ${product.images}" th:src="${img.imageUrl}" class="thumbnail"
                                th:classappend="${img.isPrimary} ? 'active' : ''"
                                onclick="document.getElementById('mainImage').src = this.src; document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active')); this.classList.add('active');">
                        </div>
                    </div>
                </div>

                <!-- Product Info -->
                <div class="col-lg-6">
                    <div class="product-info-card">
                        <span class="badge bg-info mb-2" th:text="${product.brandName}"
                            th:if="${product.brandName}">Brand</span>
                        <h1 class="h3 mb-3" th:text="${product.name}">Tên sản phẩm</h1>

                        <div class="mb-3">
                            <span class="product-price"
                                th:text="${#numbers.formatDecimal(product.currentPrice, 0, 'COMMA', 0, 'POINT')} + '₫'">1,500,000₫</span>
                            <span class="original-price ms-2"
                                th:if="${product.compareAtPrice != null and product.compareAtPrice > product.currentPrice}"
                                th:text="${#numbers.formatDecimal(product.compareAtPrice, 0, 'COMMA', 0, 'POINT')} + '₫'">2,000,000₫</span>
                        </div>

                        <p class="text-muted mb-4" th:text="${product.shortDescription}">Mô tả ngắn</p>

                        <!-- Variants -->
                        <div class="mb-4" th:if="${product.variants != null and !#lists.isEmpty(product.variants)}">
                            <label class="form-label">Phân loại:</label>
                            <div class="d-flex gap-2 flex-wrap" id="variantButtons">
                                <button th:each="v : ${product.variants}" type="button"
                                    class="btn btn-outline-secondary variant-btn" th:data-variant-id="${v.variantId}"
                                    th:data-variant-price="${v.finalPrice}" th:text="${v.variantName}"
                                    onclick="selectVariant(this)">Variant</button>
                            </div>
                            <input type="hidden" id="selectedVariantId" name="variantId" value="">
                        </div>

                        <div class="d-flex gap-3 mb-4 align-items-center">
                            <div class="input-group" style="width: 180px;">
                                <button class="btn btn-outline-secondary px-3" type="button"
                                    style="font-size: 1.25rem; font-weight: bold;"
                                    onclick="adjustQuantity(-1)">−</button>
                                <input type="number" id="quantityInput" class="form-control text-center" value="1"
                                    min="1" max="99" onchange="validateQuantity()"
                                    style="font-size: 1.1rem; font-weight: 600;">
                                <button class="btn btn-outline-secondary px-3" type="button"
                                    style="font-size: 1.25rem; font-weight: bold;"
                                    onclick="adjustQuantity(1)">+</button>
                            </div>
                            <button class="btn btn-add-cart flex-grow-1" onclick="addToCart()"
                                th:data-product-id="${product.productId}">
                                <i class="fas fa-cart-plus me-2"></i>Thêm vào giỏ
                            </button>
                            <button class="btn btn-wishlist" id="wishlistBtn" onclick="toggleWishlist()"
                                th:data-product-id="${product.productId}" title="Thêm vào yêu thích">
                                <i class="far fa-heart" id="wishlistIcon"></i>
                            </button>
                        </div>

                        <table class="spec-table w-100">
                            <tr th:if="${product.sku}">
                                <td>SKU:</td>
                                <td th:text="${product.sku}">ABC123</td>
                            </tr>
                            <tr th:if="${product.categoryName}">
                                <td>Danh mục:</td>
                                <td th:text="${product.categoryName}">Category</td>
                            </tr>
                            <tr>
                                <td>Trạng thái:</td>
                                <td><span class="badge bg-success">Còn hàng</span></td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Description -->
            <div class="row mt-5" th:if="${product.fullDescription}">
                <div class="col-12">
                    <div class="product-info-card">
                        <h4 class="mb-4">Mô tả sản phẩm</h4>
                        <div th:utext="${product.fullDescription}">Nội dung mô tả</div>
                    </div>
                </div>
            </div>

            <!-- Reviews Section -->
            <div class="row mt-5">
                <div class="col-12">
                    <div class="reviews-section" id="reviewsSection">
                        <h4 class="mb-4"><i class="fas fa-star me-2"></i>Đánh giá sản phẩm</h4>

                        <!-- Rating Overview -->
                        <div class="rating-overview" id="ratingOverview">
                            <div class="text-center py-3">
                                <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                            </div>
                        </div>

                        <!-- Write Review Button -->
                        <div class="mb-4" id="writeReviewSection"></div>

                        <!-- Reviews List -->
                        <div id="reviewsList">
                            <div class="text-center py-3">
                                <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                                <p class="text-muted mt-2">Đang tải đánh giá...</p>
                            </div>
                        </div>

                        <!-- Load More -->
                        <div class="text-center mt-3" id="loadMoreReviews" style="display: none;">
                            <button class="btn btn-outline-primary" onclick="loadMoreReviews()">
                                Xem thêm đánh giá
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Related Products -->
            <div class="mt-5" th:if="${relatedProducts != null and !#lists.isEmpty(relatedProducts)}">
                <h4 class="mb-4">Sản phẩm liên quan</h4>
                <div class="row g-3">
                    <div class="col-6 col-md-3" th:each="p : ${relatedProducts}">
                        <a th:href="@{/products/{slug}(slug=${p.slug})}" class="text-decoration-none">
                            <div class="related-product">
                                <img th:src="${p.primaryImageUrl ?: '/images/no-image.png'}" th:alt="${p.name}">
                                <div class="p-3">
                                    <div class="fw-medium text-dark small" th:text="${p.name}">Product</div>
                                    <div class="text-danger fw-bold"
                                        th:text="${#numbers.formatDecimal(p.basePrice, 0, 'COMMA', 0, 'POINT')} + '₫'">
                                        1,000,000₫</div>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            // Quantity adjustment
            function adjustQuantity(delta) {
                const input = document.getElementById('quantityInput');
                if (!input) return;
                let value = parseInt(input.value) || 1;
                value += delta;
                if (value < 1) value = 1;
                if (value > 99) value = 99;
                input.value = value;
            }

            function validateQuantity() {
                const input = document.getElementById('quantityInput');
                if (!input) return;
                let value = parseInt(input.value) || 1;
                if (value < 1) value = 1;
                if (value > 99) value = 99;
                input.value = value;
            }

            // Variant selection
            function selectVariant(button) {
                // Remove active class from all variant buttons
                document.querySelectorAll('.variant-btn').forEach(btn => {
                    btn.classList.remove('btn-primary');
                    btn.classList.add('btn-outline-secondary');
                });

                // Add active class to selected button
                button.classList.remove('btn-outline-secondary');
                button.classList.add('btn-primary');

                // Store selected variant ID
                const variantId = button.dataset.variantId;
                const hiddenInput = document.getElementById('selectedVariantId');
                if (hiddenInput) {
                    hiddenInput.value = variantId;
                }

                // Update price if variant has different price
                const variantPrice = button.dataset.variantPrice;
                if (variantPrice && parseFloat(variantPrice) > 0) {
                    const priceElement = document.querySelector('.product-price');
                    if (priceElement) {
                        const formattedPrice = new Intl.NumberFormat('vi-VN').format(parseFloat(variantPrice));
                        priceElement.textContent = formattedPrice + '₫';
                    }
                }
            }

            // Add to cart
            function addToCart() {
                const addCartBtn = document.querySelector('.btn-add-cart');
                if (!addCartBtn) return;

                const productId = addCartBtn.dataset.productId;
                const quantityInput = document.getElementById('quantityInput');
                const quantity = quantityInput ? parseInt(quantityInput.value) || 1 : 1;
                const variantInput = document.getElementById('selectedVariantId');
                const variantId = variantInput ? variantInput.value : null;

                // Check if variant selection is required
                const variantButtons = document.querySelectorAll('.variant-btn');
                if (variantButtons.length > 0 && !variantId) {
                    showToast('Vui lòng chọn phân loại sản phẩm', 'warning');
                    return;
                }

                const data = {
                    productId: parseInt(productId),
                    quantity: quantity
                };

                if (variantId) {
                    data.variantId = parseInt(variantId);
                }

                fetch('/api/cart/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                })
                    .then(response => {
                        if (response.ok) {
                            return response.json();
                        } else if (response.status === 401) {
                            window.location.href = '/login';
                            throw new Error('Unauthorized');
                        }
                        throw new Error('Failed to add to cart');
                    })
                    .then(data => {
                        showToast('Đã thêm sản phẩm vào giỏ hàng!', 'success');
                        // Update cart count in header if exists
                        updateCartCount();
                    })
                    .catch(error => {
                        if (error.message !== 'Unauthorized') {
                            showToast('Không thể thêm vào giỏ hàng. Vui lòng thử lại.', 'error');
                        }
                    });
            }

            function updateCartCount() {
                fetch('/api/cart/count')
                    .then(response => response.json())
                    .then(data => {
                        const cartBadge = document.querySelector('.cart-count');
                        if (cartBadge) {
                            cartBadge.textContent = data.count || 0;
                        }
                    })
                    .catch(() => { });
            }

            function showToast(message, type) {
                // Create toast element
                const toast = document.createElement('div');
                toast.className = `alert alert-${type === 'success' ? 'success' : type === 'warning' ? 'warning' : 'danger'} position-fixed`;
                toast.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px; animation: fadeIn 0.3s;';
                toast.innerHTML = `
                <div class="d-flex align-items-center">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'warning' ? 'exclamation-triangle' : 'times-circle'} me-2"></i>
                    <span>${message}</span>
                    <button type="button" class="btn-close ms-auto" onclick="this.parentElement.parentElement.remove()"></button>
                </div>
            `;
                document.body.appendChild(toast);

                // Auto remove after 3 seconds
                setTimeout(() => toast.remove(), 3000);
            }

            // Auto-select first variant if available
            document.addEventListener('DOMContentLoaded', function () {
                const firstVariant = document.querySelector('.variant-btn');
                if (firstVariant) {
                    selectVariant(firstVariant);
                }

                // Load wishlist status and reviews
                const productId = /*[[${product.productId}]]*/ 0;
                checkWishlistStatus(productId);
                loadRatingSummary(productId);
                loadReviews(productId);
                checkCanReview(productId);
            });

            // ===== WISHLIST =====
            function toggleWishlist() {
                const btn = document.getElementById('wishlistBtn');
                const productId = btn.dataset.productId;

                fetch(`/api/wishlist/${productId}/toggle`, { method: 'POST' })
                    .then(response => {
                        if (response.status === 401) {
                            window.location.href = '/login';
                            return null;
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data) {
                            updateWishlistButton(data.inWishlist);
                            showToast(data.message, 'success');
                        }
                    })
                    .catch(error => console.error('Error:', error));
            }

            function checkWishlistStatus(productId) {
                fetch(`/api/wishlist/check/${productId}`)
                    .then(response => response.json())
                    .then(data => updateWishlistButton(data.inWishlist))
                    .catch(() => { });
            }

            function updateWishlistButton(inWishlist) {
                const btn = document.getElementById('wishlistBtn');
                const icon = document.getElementById('wishlistIcon');
                if (inWishlist) {
                    btn.classList.add('active');
                    icon.classList.remove('far');
                    icon.classList.add('fas');
                } else {
                    btn.classList.remove('active');
                    icon.classList.remove('fas');
                    icon.classList.add('far');
                }
            }

            // ===== REVIEWS =====
            let currentReviewPage = 0;
            let totalReviewPages = 0;

            function loadRatingSummary(productId) {
                fetch(`/api/products/${productId}/rating-summary`)
                    .then(response => response.json())
                    .then(data => renderRatingSummary(data))
                    .catch(() => { });
            }

            function renderRatingSummary(summary) {
                const container = document.getElementById('ratingOverview');
                if (summary.totalReviews === 0) {
                    container.innerHTML = `
                        <div class="text-center w-100 py-3">
                            <p class="text-muted mb-0">Chưa có đánh giá nào</p>
                        </div>
                    `;
                    return;
                }

                let starsHtml = '';
                for (let i = 1; i <= 5; i++) {
                    starsHtml += `<i class="fas fa-star${i <= Math.round(summary.averageRating) ? '' : ' text-muted'}"></i>`;
                }

                let barsHtml = '';
                for (let i = 5; i >= 1; i--) {
                    const count = summary.ratingDistribution[i] || 0;
                    const percent = summary.ratingPercentages[i] || 0;
                    barsHtml += `
                        <div class="rating-bar">
                            <span class="label">${i} sao</span>
                            <div class="bar"><div class="bar-fill" style="width: ${percent}%"></div></div>
                            <span class="count">${count}</span>
                        </div>
                    `;
                }

                container.innerHTML = `
                    <div class="rating-big">
                        <div class="number">${summary.averageRating}</div>
                        <div class="stars">${starsHtml}</div>
                        <div class="text-muted small">${summary.totalReviews} đánh giá</div>
                    </div>
                    <div class="rating-bars">${barsHtml}</div>
                `;
            }

            function loadReviews(productId, page = 0) {
                fetch(`/api/products/${productId}/reviews?page=${page}&size=5`)
                    .then(response => response.json())
                    .then(data => {
                        renderReviews(data.content, page === 0);
                        currentReviewPage = data.number;
                        totalReviewPages = data.totalPages;
                        document.getElementById('loadMoreReviews').style.display =
                            currentReviewPage < totalReviewPages - 1 ? 'block' : 'none';
                    })
                    .catch(() => {
                        document.getElementById('reviewsList').innerHTML =
                            '<p class="text-muted">Không thể tải đánh giá</p>';
                    });
            }

            function renderReviews(reviews, replace = true) {
                const container = document.getElementById('reviewsList');

                if (reviews.length === 0 && replace) {
                    container.innerHTML = '<p class="text-muted text-center py-3">Chưa có đánh giá nào</p>';
                    return;
                }

                let html = replace ? '' : container.innerHTML;
                reviews.forEach(review => {
                    let starsHtml = '';
                    for (let i = 1; i <= 5; i++) {
                        starsHtml += `<i class="fas fa-star${i <= review.rating ? ' text-warning' : ' text-muted'}"></i>`;
                    }

                    let imagesHtml = '';
                    if (review.images && review.images.length > 0) {
                        imagesHtml = '<div class="review-images">';
                        review.images.forEach(img => {
                            imagesHtml += `<img src="${img.imageUrl}" alt="Review image" onclick="window.open('${img.imageUrl}')">`;
                        });
                        imagesHtml += '</div>';
                    }

                    html += `
                        <div class="review-item">
                            <div class="review-header">
                                <img src="${review.userAvatar || '/images/default-avatar.png'}" class="review-avatar" alt="">
                                <div class="review-meta">
                                    <div class="review-author">
                                        ${review.userName}
                                        ${review.isVerifiedPurchase ? '<span class="verified-badge"><i class="fas fa-check me-1"></i>Đã mua hàng</span>' : ''}
                                    </div>
                                    <div class="small">
                                        <span class="me-2">${starsHtml}</span>
                                        <span class="text-muted">${new Date(review.createdAt).toLocaleDateString('vi-VN')}</span>
                                    </div>
                                </div>
                            </div>
                            ${review.title ? `<h6 class="mb-1">${review.title}</h6>` : ''}
                            <p class="mb-0">${review.comment || ''}</p>
                            ${imagesHtml}
                            <div class="review-actions">
                                <button onclick="voteHelpful(${review.reviewId}, true)">
                                    <i class="far fa-thumbs-up me-1"></i>${review.helpfulCount} hữu ích
                                </button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }

            function loadMoreReviews() {
                const productId = document.querySelector('.btn-add-cart').dataset.productId;
                loadReviews(productId, currentReviewPage + 1);
            }

            function checkCanReview(productId) {
                fetch(`/api/products/${productId}/can-review`)
                    .then(response => response.json())
                    .then(data => {
                        const container = document.getElementById('writeReviewSection');
                        if (!data.loggedIn) {
                            container.innerHTML = `
                                <a href="/login" class="btn btn-outline-primary">
                                    <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập để viết đánh giá
                                </a>
                            `;
                        } else if (data.canReview) {
                            container.innerHTML = `
                                <button class="btn btn-primary" onclick="showReviewForm()">
                                    <i class="fas fa-pen me-2"></i>Viết đánh giá
                                </button>
                                <div id="reviewFormContainer"></div>
                            `;
                        } else {
                            // User has already reviewed - load and show their review
                            loadUserReview(productId);
                        }
                    })
                    .catch(() => { });
            }

            function loadUserReview(productId) {
                const container = document.getElementById('writeReviewSection');
                fetch(`/api/products/${productId}/my-review`)
                    .then(response => response.json())
                    .then(review => {
                        if (review) {
                            const statusBadge = review.status === 'PENDING'
                                ? '<span class="badge bg-warning ms-2"><i class="fas fa-clock me-1"></i>Đang chờ duyệt</span>'
                                : review.status === 'APPROVED'
                                    ? '<span class="badge bg-success ms-2"><i class="fas fa-check me-1"></i>Đã duyệt</span>'
                                    : '<span class="badge bg-danger ms-2"><i class="fas fa-times me-1"></i>Bị từ chối</span>';

                            const stars = Array(5).fill(0).map((_, i) =>
                                `<i class="${i < review.rating ? 'fas' : 'far'} fa-star text-warning"></i>`
                            ).join('');

                            container.innerHTML = `
                                <div class="card border-primary">
                                    <div class="card-header bg-light d-flex justify-content-between align-items-center">
                                        <span><i class="fas fa-check-circle text-success me-2"></i>Đánh giá của bạn</span>
                                        ${statusBadge}
                                    </div>
                                    <div class="card-body">
                                        <div class="mb-2">${stars}</div>
                                        ${review.title ? `<h6>${review.title}</h6>` : ''}
                                        <p class="mb-2">${review.comment || ''}</p>
                                        <small class="text-muted">Đánh giá lúc: ${new Date(review.createdAt).toLocaleDateString('vi-VN')}</small>
                                    </div>
                                </div>
                            `;
                        } else {
                            container.innerHTML = `
                                <p class="text-muted mb-0"><i class="fas fa-check-circle text-success me-2"></i>Bạn đã đánh giá sản phẩm này</p>
                            `;
                        }
                    })
                    .catch(() => {
                        container.innerHTML = `
                            <p class="text-muted mb-0"><i class="fas fa-check-circle text-success me-2"></i>Bạn đã đánh giá sản phẩm này</p>
                        `;
                    });
            }

            function showReviewForm() {
                const container = document.getElementById('reviewFormContainer');
                container.innerHTML = `
                    <div class="review-form mt-3">
                        <h5 class="mb-3">Viết đánh giá của bạn</h5>
                        <div class="mb-3">
                            <label class="form-label">Đánh giá</label>
                            <div class="star-rating" id="starRating">
                                <i class="far fa-star" data-rating="1"></i>
                                <i class="far fa-star" data-rating="2"></i>
                                <i class="far fa-star" data-rating="3"></i>
                                <i class="far fa-star" data-rating="4"></i>
                                <i class="far fa-star" data-rating="5"></i>
                            </div>
                            <input type="hidden" id="reviewRating" value="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tiêu đề (tùy chọn)</label>
                            <input type="text" class="form-control" id="reviewTitle" maxlength="200">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nội dung đánh giá</label>
                            <textarea class="form-control" id="reviewComment" rows="4" maxlength="2000"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Thêm hình ảnh (tối đa 5 ảnh, mỗi ảnh tối đa 5MB)</label>
                            <input type="file" class="form-control" id="reviewImages" accept="image/*" multiple>
                            <div id="imagePreviewContainer" class="d-flex flex-wrap gap-2 mt-2"></div>
                            <input type="hidden" id="uploadedImageUrls" value="">
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-primary" onclick="submitReview()" id="submitReviewBtn">
                                <i class="fas fa-paper-plane me-2"></i>Gửi đánh giá
                            </button>
                            <button class="btn btn-outline-secondary" onclick="document.getElementById('reviewFormContainer').innerHTML=''">
                                Hủy
                            </button>
                        </div>
                    </div>
                `;

                // Setup image preview
                document.getElementById('reviewImages').addEventListener('change', handleImageSelect);

                // Setup star rating
                document.querySelectorAll('#starRating i').forEach(star => {
                    star.addEventListener('click', function () {
                        const rating = parseInt(this.dataset.rating);
                        document.getElementById('reviewRating').value = rating;
                        document.querySelectorAll('#starRating i').forEach((s, idx) => {
                            if (idx < rating) {
                                s.classList.remove('far');
                                s.classList.add('fas', 'active');
                            } else {
                                s.classList.remove('fas', 'active');
                                s.classList.add('far');
                            }
                        });
                    });
                });
            }

            let selectedImageFiles = [];

            function handleImageSelect(event) {
                const files = Array.from(event.target.files).slice(0, 5); // Max 5 images
                selectedImageFiles = files;

                const previewContainer = document.getElementById('imagePreviewContainer');
                previewContainer.innerHTML = '';

                files.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const previewDiv = document.createElement('div');
                        previewDiv.className = 'position-relative';
                        previewDiv.innerHTML = `
                            <img src="${e.target.result}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;">
                            <button type="button" class="btn btn-sm btn-danger position-absolute" 
                                    style="top: -5px; right: -5px; padding: 2px 6px; font-size: 10px;"
                                    onclick="removeImagePreview(${index})">
                                <i class="fas fa-times"></i>
                            </button>
                        `;
                        previewContainer.appendChild(previewDiv);
                    };
                    reader.readAsDataURL(file);
                });
            }

            function removeImagePreview(index) {
                selectedImageFiles.splice(index, 1);

                // Rebuild preview
                const previewContainer = document.getElementById('imagePreviewContainer');
                previewContainer.innerHTML = '';
                selectedImageFiles.forEach((file, idx) => {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const previewDiv = document.createElement('div');
                        previewDiv.className = 'position-relative';
                        previewDiv.innerHTML = `
                            <img src="${e.target.result}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;">
                            <button type="button" class="btn btn-sm btn-danger position-absolute" 
                                    style="top: -5px; right: -5px; padding: 2px 6px; font-size: 10px;"
                                    onclick="removeImagePreview(${idx})">
                                <i class="fas fa-times"></i>
                            </button>
                        `;
                        previewContainer.appendChild(previewDiv);
                    };
                    reader.readAsDataURL(file);
                });
            }

            async function submitReview() {
                const productId = document.querySelector('.btn-add-cart').dataset.productId;
                const rating = parseInt(document.getElementById('reviewRating').value);
                const title = document.getElementById('reviewTitle').value;
                const comment = document.getElementById('reviewComment').value;

                if (rating < 1) {
                    showToast('Vui lòng chọn số sao đánh giá', 'warning');
                    return;
                }

                // Disable submit button
                const submitBtn = document.getElementById('submitReviewBtn');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Đang gửi...';

                let imageUrls = [];

                try {
                    // Upload images first if any
                    if (selectedImageFiles.length > 0) {
                        const formData = new FormData();
                        selectedImageFiles.forEach(file => formData.append('files', file));

                        const uploadResponse = await fetch('/api/reviews/upload-images', {
                            method: 'POST',
                            body: formData
                        });

                        if (uploadResponse.ok) {
                            const uploadResult = await uploadResponse.json();
                            if (uploadResult.success) {
                                imageUrls = uploadResult.imageUrls;
                            }
                        }
                    }

                    // Submit review with image URLs
                    const response = await fetch(`/api/products/${productId}/reviews`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ rating, title, comment, imageUrls })
                    });

                    if (response.ok) {
                        showToast('Đánh giá của bạn đã được gửi và đang chờ duyệt', 'success');
                        document.getElementById('reviewFormContainer').innerHTML = '';
                        selectedImageFiles = [];
                        checkCanReview(productId);
                        loadReviews(productId);
                        loadRatingSummary(productId);
                    } else {
                        const data = await response.json();
                        throw new Error(data.error || 'Không thể gửi đánh giá');
                    }
                } catch (error) {
                    showToast(error.message || 'Không thể gửi đánh giá', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Gửi đánh giá';
                }
            }

            function voteHelpful(reviewId, isHelpful) {
                fetch(`/api/reviews/${reviewId}/helpful`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isHelpful })
                })
                    .then(response => {
                        if (response.status === 401) {
                            window.location.href = '/login';
                        } else if (response.ok) {
                            const productId = document.querySelector('.btn-add-cart').dataset.productId;
                            loadReviews(productId, currentReviewPage);
                        }
                    })
                    .catch(() => { });
            }
        </script>
    </th:block>
</body>

</html>
