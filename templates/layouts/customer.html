<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="${pageDescription} ?: 'Cửa hàng cầu lông chính hãng - Badminton Shop'">

    <title layout:title-pattern="$CONTENT_TITLE - Badminton Shop">Badminton Shop</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Main CSS -->
    <link th:href="@{/css/main.css}" rel="stylesheet">

    <!-- Page-specific CSS -->
    <th:block layout:fragment="styles"></th:block>
</head>

<body>
    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Alerts -->
    <div class="container mt-3">
        <div th:replace="~{fragments/alerts :: all}"></div>
    </div>

    <!-- Main Content -->
    <main layout:fragment="content">
        <!-- Page content will be inserted here -->
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main JS -->
    <script th:src="@{/js/main.js}"></script>

    <!-- Notification JS -->
    <script sec:authorize="hasRole('USER')" th:inline="javascript">
        // Load notification count on page load
        document.addEventListener('DOMContentLoaded', function () {
            loadNotificationCount();
        });

        function loadNotificationCount() {
            fetch('/api/notifications/unread-count')
                .then(r => r.json())
                .then(data => {
                    const badge = document.querySelector('.notification-count');
                    if (badge && data.count !== undefined) {
                        if (data.count > 0) {
                            badge.textContent = data.count > 99 ? '99+' : data.count;
                            badge.style.display = 'inline';
                        } else {
                            badge.style.display = 'none';
                        }
                    }
                })
                .catch(() => { });
        }

        function loadNotifications() {
            const container = document.getElementById('notificationList');
            if (!container) return;

            fetch('/api/notifications?page=0&size=5')
                .then(response => {
                    if (!response.ok) throw new Error('Failed');
                    return response.json();
                })
                .then(data => {
                    if (!data.content || data.content.length === 0) {
                        container.innerHTML = `
                            <div class="text-center py-4 text-muted">
                                <i class="fas fa-bell-slash"></i>
                                <p class="small mb-0">Không có thông báo</p>
                            </div>
                        `;
                        return;
                    }

                    container.innerHTML = data.content.map(n => {
                        const iconClass = getNotifIcon(n.type);
                        const timeAgo = formatNotifTime(n.createdAt);
                        return `
                            <a href="${n.link || '/notifications'}" class="d-block px-3 py-2 border-bottom text-decoration-none ${n.isRead ? '' : 'bg-light'}">
                                <div class="d-flex gap-2">
                                    <div class="text-${iconClass.color}">
                                        <i class="${iconClass.icon}"></i>
                                    </div>
                                    <div class="flex-grow-1">
                                        <div class="small fw-medium text-dark">${n.title}</div>
                                        <div class="small text-muted text-truncate" style="max-width: 220px;">${n.message}</div>
                                        <div class="small text-muted">${timeAgo}</div>
                                    </div>
                                </div>
                            </a>
                        `;
                    }).join('');
                })
                .catch(() => {
                    container.innerHTML = `
                        <div class="text-center py-4 text-muted">
                            <i class="fas fa-exclamation-circle"></i>
                            <p class="small mb-0">Không thể tải thông báo</p>
                        </div>
                    `;
                });
        }

        function getNotifIcon(type) {
            switch (type) {
                case 'ORDER_UPDATE': return { icon: 'fas fa-shopping-bag', color: 'success' };
                case 'PROMOTION': return { icon: 'fas fa-percent', color: 'warning' };
                case 'PRICE_DROP': return { icon: 'fas fa-arrow-down', color: 'danger' };
                case 'RESTOCK': return { icon: 'fas fa-boxes', color: 'primary' };
                case 'SYSTEM': return { icon: 'fas fa-cog', color: 'secondary' };
                default: return { icon: 'fas fa-bell', color: 'primary' };
            }
        }

        function formatNotifTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);

            if (diff < 60) return 'Vừa xong';
            if (diff < 3600) return Math.floor(diff / 60) + ' phút trước';
            if (diff < 86400) return Math.floor(diff / 3600) + ' giờ trước';
            return date.toLocaleDateString('vi-VN');
        }

        function markAllAsRead() {
            fetch('/api/notifications/read-all', { method: 'PUT' })
                .then(r => r.json())
                .then(() => {
                    loadNotificationCount();
                    loadNotifications();
                })
                .catch(() => { });
        }
    </script>

    <!-- Page-specific JS -->
    <th:block layout:fragment="scripts"></th:block>
</body>

</html>
