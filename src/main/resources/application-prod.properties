# ============================================
# PRODUCTION PROFILE
# ============================================
# This profile is activated on Railway via SPRING_PROFILES_ACTIVE=prod

# ==================== DATABASE ====================
# These are overridden by Railway environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/badminton_shop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool for production
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JPA Production Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==================== THYMELEAF ====================
spring.thymeleaf.cache=true

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.com.badmintonshop=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ==================== HEALTH CHECK ====================
# Disable mail health check (Railway blocks SMTP)
management.health.mail.enabled=false

# ==================== SECURITY ====================
server.forward-headers-strategy=framework

# ==================== EMAIL ====================
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.email.from=${MAIL_FROM:noreply@badmintonshop.vn}

# ==================== GOOGLE OAUTH2 ====================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# ==================== BASE URL ====================
app.base-url=${BASE_URL:https://badminton-shop.railway.app}

# ==================== VNPAY ====================
vnpay.returnUrl=${VNPAY_RETURN_URL:https://badminton-shop.railway.app/api/payment/vnpay-return}
vnpay.tmnCode=${VNPAY_TMN_CODE:5BXYT9QA}
vnpay.hashSecret=${VNPAY_HASH_SECRET:RBHK0ASFQZ4LMEGZS4T255N8TUGUO2TU}

# ==================== OPENROUTER AI ====================
openrouter.api.key=${OPENROUTER_API_KEY:}

# ==================== ADMIN ====================
app.admin.email=${ADMIN_EMAIL:admin@badmintonshop.vn}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.name=${ADMIN_NAME:Admin}
app.admin.phone=${ADMIN_PHONE:0909000001}

