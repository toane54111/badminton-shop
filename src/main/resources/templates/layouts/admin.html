<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title layout:title-pattern="$CONTENT_TITLE - Admin Panel">Admin Panel</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Main CSS -->
    <link th:href="@{/css/main.css}" rel="stylesheet">

    <!-- Admin CSS -->
    <link th:href="@{/css/admin.css}" rel="stylesheet">

    <!-- Page-specific CSS -->
    <th:block layout:fragment="styles"></th:block>
</head>

<body>
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

        <!-- Sidebar Overlay (mobile) -->
        <div th:replace="~{fragments/admin-sidebar :: sidebar-overlay}"></div>

        <!-- Main Content -->
        <div class="admin-main">
            <!-- Header -->
            <div th:replace="~{fragments/admin-header :: header}"></div>

            <!-- Content -->
            <div class="admin-content">
                <!-- Alerts -->
                <div th:replace="~{fragments/alerts :: all}"></div>
                <div th:replace="~{fragments/alerts :: flash}"></div>

                <!-- Page Content -->
                <div layout:fragment="content">
                    <!-- Page content will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main JS -->
    <script th:src="@{/js/main.js}"></script>

    <!-- Sidebar Active State JS -->
    <th:block th:replace="~{fragments/admin-sidebar :: sidebar-script}"></th:block>

    <!-- Page-specific JS -->
    <th:block layout:fragment="scripts"></th:block>
</body>

</html>
