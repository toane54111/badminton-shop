<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Badminton Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff6b35;
            --primary-dark: #e55a2b;
            --gradient-start: #ff6b35;
            --gradient-end: #ff8c42;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            max-width: 480px;
            width: 100%;
            padding: 40px;
            margin: 20px;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo i {
            font-size: 48px;
            color: var(--primary-color);
        }

        .auth-logo h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin-top: 10px;
        }

        .form-floating {
            margin-bottom: 16px;
        }

        .form-floating input {
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            transition: all 0.3s ease;
        }

        .form-floating input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.15);
        }

        .form-floating input.is-invalid {
            border-color: #dc3545;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 53, 0.3);
            background: linear-gradient(135deg, var(--primary-dark), var(--gradient-start));
        }

        .auth-links {
            text-align: center;
            margin-top: 24px;
        }

        .auth-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 12px;
            border: none;
        }

        .password-requirements {
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
        }

        .password-requirements li {
            margin-bottom: 4px;
        }

        .password-requirements li.valid {
            color: #10b981;
        }

        .password-requirements li.valid::before {
            content: '✓ ';
        }

        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        a {
            color: var(--primary-color);
        }

        a:hover {
            color: var(--primary-dark);
        }
    </style>
</head>

<body>
    <!-- Header -->
    <nav class="navbar navbar-light bg-white shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="fas fa-shuttlecock me-2" style="color: #ff6b35"></i>Badminton Shop
            </a>
        </div>
    </nav>

    <div class="auth-card" style="margin-top: 80px;">
        <h2 class="text-center mb-4" style="color: #1f2937; font-weight: 700;">Tạo tài khoản</h2>

        <!-- Error Messages -->
        <div th:if="${error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Registration Form -->
        <form th:action="@{/register}" method="post" th:object="${registerRequest}">
            <div class="form-floating">
                <input type="text" class="form-control" th:field="*{fullName}"
                    th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" placeholder="Họ và tên" required>
                <label><i class="fas fa-user me-2"></i>Họ và tên</label>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="form-floating">
                <input type="email" class="form-control" th:field="*{email}"
                    th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="Email" required>
                <label><i class="fas fa-envelope me-2"></i>Email</label>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-floating">
                <input type="tel" class="form-control" th:field="*{phone}"
                    th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" placeholder="Số điện thoại">
                <label><i class="fas fa-phone me-2"></i>Số điện thoại (tùy chọn)</label>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>

            <div class="form-floating">
                <input type="password" class="form-control" id="password" th:field="*{password}"
                    th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" placeholder="Mật khẩu" required>
                <label><i class="fas fa-lock me-2"></i>Mật khẩu</label>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <ul class="password-requirements list-unstyled ms-2">
                <li id="length">Ít nhất 8 ký tự</li>
                <li id="uppercase">Ít nhất 1 chữ hoa</li>
                <li id="lowercase">Ít nhất 1 chữ thường</li>
                <li id="number">Ít nhất 1 số</li>
            </ul>

            <div class="form-floating">
                <input type="password" class="form-control" th:field="*{confirmPassword}"
                    th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                    placeholder="Xác nhận mật khẩu" required>
                <label><i class="fas fa-lock me-2"></i>Xác nhận mật khẩu</label>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                    th:errors="*{confirmPassword}"></div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label" for="terms">
                    Tôi đồng ý với <a href="#">Điều khoản sử dụng</a> và <a href="#">Chính sách bảo mật</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-user-plus me-2"></i>Đăng ký
            </button>
        </form>

        <div class="auth-links">
            <p class="mb-0">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Password strength validation
        const password = document.getElementById('password');
        const requirements = {
            length: document.getElementById('length'),
            uppercase: document.getElementById('uppercase'),
            lowercase: document.getElementById('lowercase'),
            number: document.getElementById('number')
        };

        password.addEventListener('input', function () {
            const value = this.value;

            // Check length
            if (value.length >= 8) {
                requirements.length.classList.add('valid');
            } else {
                requirements.length.classList.remove('valid');
            }

            // Check uppercase
            if (/[A-Z]/.test(value)) {
                requirements.uppercase.classList.add('valid');
            } else {
                requirements.uppercase.classList.remove('valid');
            }

            // Check lowercase
            if (/[a-z]/.test(value)) {
                requirements.lowercase.classList.add('valid');
            } else {
                requirements.lowercase.classList.remove('valid');
            }

            // Check number
            if (/\d/.test(value)) {
                requirements.number.classList.add('valid');
            } else {
                requirements.number.classList.remove('valid');
            }
        });
    </script>
</body>

</html>
