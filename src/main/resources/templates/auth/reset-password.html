<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Badminton Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            max-width: 420px;
            width: 100%;
            padding: 40px;
            margin: 20px;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo i {
            font-size: 48px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-logo h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin-top: 10px;
        }

        .form-floating {
            margin-bottom: 16px;
        }

        .form-floating input {
            border-radius: 12px;
            border: 2px solid #e5e7eb;
        }

        .form-floating input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .alert {
            border-radius: 12px;
            border: none;
        }

        .password-requirements {
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
        }

        .password-requirements li.valid {
            color: #10b981;
        }

        .password-requirements li.valid::before {
            content: '✓ ';
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="auth-logo">
            <i class="fas fa-lock-open"></i>
            <h1>Đặt lại mật khẩu</h1>
        </div>

        <div th:if="${error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/reset-password}" method="post" th:object="${resetPasswordRequest}">
            <input type="hidden" th:field="*{token}">

            <div class="form-floating">
                <input type="password" class="form-control" id="password" th:field="*{password}"
                    th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" placeholder="Mật khẩu mới"
                    required>
                <label><i class="fas fa-lock me-2"></i>Mật khẩu mới</label>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <ul class="password-requirements list-unstyled ms-2">
                <li id="length">Ít nhất 8 ký tự</li>
                <li id="uppercase">Ít nhất 1 chữ hoa</li>
                <li id="lowercase">Ít nhất 1 chữ thường</li>
                <li id="number">Ít nhất 1 số</li>
            </ul>

            <div class="form-floating">
                <input type="password" class="form-control" th:field="*{confirmPassword}"
                    th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                    placeholder="Xác nhận mật khẩu" required>
                <label><i class="fas fa-lock me-2"></i>Xác nhận mật khẩu</label>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                    th:errors="*{confirmPassword}"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-3">
                <i class="fas fa-save me-2"></i>Lưu mật khẩu mới
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const password = document.getElementById('password');
        const requirements = {
            length: document.getElementById('length'),
            uppercase: document.getElementById('uppercase'),
            lowercase: document.getElementById('lowercase'),
            number: document.getElementById('number')
        };

        password.addEventListener('input', function () {
            const value = this.value;
            requirements.length.classList.toggle('valid', value.length >= 8);
            requirements.uppercase.classList.toggle('valid', /[A-Z]/.test(value));
            requirements.lowercase.classList.toggle('valid', /[a-z]/.test(value));
            requirements.number.classList.toggle('valid', /\d/.test(value));
        });
    </script>
</body>

</html>
