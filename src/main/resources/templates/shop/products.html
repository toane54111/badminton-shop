<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/customer}">

<head>
    <title>Sản phẩm</title>
    <style>
        .filter-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 1rem;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            height: 200px;
            object-fit: cover;
            width: 100%;
        }

        .product-title {
            font-weight: 600;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-price {
            color: #e74c3c;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .original-price {
            text-decoration: line-through;
            color: #999;
            font-size: 0.9rem;
        }

        .category-item {
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }

        .category-item:last-child {
            border-bottom: none;
        }

        .brand-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: #f8f9fa;
            margin: 0.25rem;
            transition: all 0.3s;
        }

        .brand-badge:hover {
            background: #667eea;
            color: white;
        }

        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3rem 0;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>
    <main layout:fragment="content">
        <!-- Page Header -->
        <div class="page-header">
            <div class="container">
                <h1>Sản phẩm</h1>
                <p class="mb-0">Khám phá bộ sưu tập cầu lông chất lượng cao</p>
            </div>
        </div>

        <div class="container pb-5">
            <div class="row">
                <!-- Filters Sidebar -->
                <div class="col-lg-3">
                    <form id="filterForm" th:action="@{/products}" method="get">
                        <!-- Search -->
                        <div class="filter-card">
                            <h6 class="mb-3"><i class="fas fa-search me-2"></i>Tìm kiếm</h6>
                            <div class="input-group">
                                <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                                    placeholder="Tên sản phẩm...">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Categories -->
                        <div class="filter-card">
                            <h6 class="mb-3"><i class="fas fa-folder me-2"></i>Danh mục</h6>
                            <select class="form-select" name="categoryId" onchange="this.form.submit()">
                                <option value="">Tất cả danh mục</option>
                                <th:block th:each="cat : ${categories}">
                                    <option th:value="${cat.categoryId}" th:text="${cat.name}"
                                        th:selected="${cat.categoryId == categoryId}"></option>
                                </th:block>
                            </select>
                        </div>

                        <!-- Brands -->
                        <div class="filter-card">
                            <h6 class="mb-3"><i class="fas fa-tags me-2"></i>Thương hiệu</h6>
                            <select class="form-select" name="brandId" onchange="this.form.submit()">
                                <option value="">Tất cả thương hiệu</option>
                                <option th:each="brand : ${brands}" th:value="${brand.brandId}" th:text="${brand.name}"
                                    th:selected="${brand.brandId == brandId}"></option>
                            </select>
                        </div>

                        <!-- Sort -->
                        <div class="filter-card">
                            <h6 class="mb-3"><i class="fas fa-sort me-2"></i>Sắp xếp</h6>
                            <select class="form-select" name="sortBy" onchange="this.form.submit()">
                                <option value="createdAt" th:selected="${sortBy == 'createdAt'}">Mới nhất</option>
                                <option value="basePrice" th:selected="${sortBy == 'basePrice'}">Giá</option>
                                <option value="name" th:selected="${sortBy == 'name'}">Tên A-Z</option>
                                <option value="viewCount" th:selected="${sortBy == 'viewCount'}">Xem nhiều</option>
                            </select>
                        </div>

                        <a th:href="${currentUserId != null} ? @{/products(uid=${currentUserId})} : @{/products}"
                            class="btn btn-outline-secondary w-100">
                            <i class="fas fa-redo me-1"></i>Xóa bộ lọc
                        </a>
                    </form>
                </div>

                <!-- Products Grid -->
                <div class="col-lg-9">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span class="text-muted"
                            th:text="'Hiển thị ' + ${products.numberOfElements} + ' / ' + ${products.totalElements} + ' sản phẩm'"></span>
                    </div>

                    <div class="row g-4">
                        <div class="col-md-4" th:each="p : ${products.content}">
                            <a th:href="${currentUserId != null} ? @{/products/{slug}(slug=${p.slug}, uid=${currentUserId})} : @{/products/{slug}(slug=${p.slug})}"
                                class="text-decoration-none">
                                <div class="product-card">
                                    <img th:src="${p.primaryImageUrl ?: '/images/no-image.png'}" th:alt="${p.name}"
                                        class="product-image">
                                    <div class="p-3">
                                        <div class="product-title" th:text="${p.name}">Sản phẩm</div>
                                        <small class="text-muted" th:text="${p.brandName}">Thương hiệu</small>
                                        <div class="mt-2">
                                            <span class="product-price"
                                                th:text="${#numbers.formatDecimal(p.basePrice, 0, 'COMMA', 0, 'POINT')} + '₫'">1,000,000₫</span>
                                            <span class="original-price ms-2" th:if="${p.compareAtPrice != null}"
                                                th:text="${#numbers.formatDecimal(p.compareAtPrice, 0, 'COMMA', 0, 'POINT')} + '₫'"></span>
                                        </div>
                                    </div>
                                </div>
                            </a>
                        </div>

                        <!-- Empty State -->
                        <div class="col-12" th:if="${products.content == null or #lists.isEmpty(products.content)}">
                            <div class="text-center py-5 text-muted">
                                <i class="fas fa-box-open fa-3x mb-3"></i>
                                <h5>Không tìm thấy sản phẩm</h5>
                                <p>Thử thay đổi bộ lọc để tìm kiếm</p>
                            </div>
                        </div>
                    </div>

                    <!-- Pagination -->
                    <nav class="mt-5" th:if="${products.totalPages > 1}">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                                <a class="page-link"
                                    th:href="${currentUserId != null} ? @{/products(page=${products.number - 1}, keyword=${keyword}, categoryId=${categoryId}, brandId=${brandId}, uid=${currentUserId})} : @{/products(page=${products.number - 1}, keyword=${keyword}, categoryId=${categoryId}, brandId=${brandId})}">«</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                                th:classappend="${i == products.number} ? 'active'">
                                <a class="page-link"
                                    th:href="${currentUserId != null} ? @{/products(page=${i}, keyword=${keyword}, categoryId=${categoryId}, brandId=${brandId}, uid=${currentUserId})} : @{/products(page=${i}, keyword=${keyword}, categoryId=${categoryId}, brandId=${brandId})}"
                                    th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                                <a class="page-link"
                                    th:href="${currentUserId != null} ? @{/products(page=${products.number + 1}, keyword=${keyword}, categoryId=${categoryId}, brandId=${brandId}, uid=${currentUserId})} : @{/products(page=${products.number + 1}, keyword=${keyword}, categoryId=${categoryId}, brandId=${brandId})}">»</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
